<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Studio - Madhav Kadam</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #070b14; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; margin: 0; }
    
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 18px; width: 100%; max-width: 400px; padding: 26px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
    h2 { font-size: 19px; color: #38bdf8; font-weight: 700; margin-bottom: 6px; }
    p.subtext { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
    
    .input-group { position: relative; width: 100%; margin-bottom: 16px; }
    input[type="password"], input[type="text"] { width: 100%; padding: 14px 44px 14px 16px; border-radius: 10px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .eye-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 18px; }

    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; }
    button:active { opacity: 0.9; }
    .msg-box { font-size: 14px; text-align: center; margin-top: 12px; display: none; color: #ef4444; font-weight: 600; }
    
    /* Animation Overlay */
    #welcomeOverlay { display: none; position: fixed; inset: 0; background: #030712; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; }
    .welcome-text { font-size: 28px; font-weight: 800; background: linear-gradient(120deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; animation: glowPulse 1.8s infinite; }
    .welcome-sub { margin-top: 10px; color: #94a3b8; font-size: 14px; letter-spacing: 2px; }

    @keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6)); } 50% { filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.9)); } }

    /* Vault View */
    #vaultView { display: none; width: 100%; max-width: 500px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .lock-btn { width: auto; padding: 6px 14px; font-size: 13px; background: #1f2937; border-radius: 8px; border: 1px solid #374151; }

    .upload-card { background: #111827; border: 1px dashed #38bdf8; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    .file-btn { display: inline-block; width: 100%; padding: 12px; background: #0284c7; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; color: #fff; }
    #uploadStatus { font-size: 13px; margin-top: 10px; color: #38bdf8; }

    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .media-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #1f2937; border: 1px solid #374151; }
    .media-item img { width: 100%; height: 100%; object-fit: cover; }
    .delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- Fullscreen Animation -->
  <div id="welcomeOverlay">
    <div class="welcome-text">Welcome Madhav Kadam</div>
    <div class="welcome-sub">Opening Private Studio...</div>
  </div>

  <!-- Login Card with Form Submit -->
  <div class="card" id="loginBox">
    <h2>Welcome Madhav Kadam to Private Studio</h2>
    <p class="subtext">Enter secret password to access vault</p>
    
    <form id="loginForm" onsubmit="event.preventDefault(); unlockStudio();">
      <div class="input-group">
        <input type="password" id="passInput" placeholder="Password: 1234" autocomplete="off">
        <span class="eye-toggle" id="eyeIcon" onclick="togglePasswordEye()">👁️</span>
      </div>
      
      <button type="submit" id="unlockBtn">Unlock Studio</button>
    </form>
    
    <p id="loginError" class="msg-box"></p>
  </div>

  <!-- Main Vault Dashboard -->
  <div id="vaultView">
    <div class="header-bar">
      <div>
        <h3 style="color: #38bdf8; font-size: 18px;">Madhav's Studio</h3>
        <p style="font-size: 12px; color: #94a3b8;" id="statsText">0 Photos</p>
      </div>
      <button type="button" class="lock-btn" onclick="lockStudio()">Lock</button>
    </div>

    <!-- Upload Box -->
    <div class="upload-card">
      <label class="file-btn" for="photoChooser">📷 Select Photo to Upload</label>
      <input type="file" id="photoChooser" accept="image/*" onchange="uploadPhotoCloud()">
      <div id="uploadStatus">Tap button to save photo</div>
    </div>

    <!-- Gallery -->
    <div class="gallery-grid" id="photoContainer"></div>
  </div>

  <script>
    const IMGBB_KEY = "0b61d186b1634f7eca045a72a950fa72";
    let myMedia = JSON.parse(localStorage.getItem("madhav_personal_vault") || "[]");

    // Eye Toggle
    function togglePasswordEye() {
      const field = document.getElementById("passInput");
      field.type = (field.type === "password") ? "text" : "password";
    }

    // Direct Unlock Function
    function unlockStudio() {
      const val = document.getElementById("passInput").value.trim();
      const err = document.getElementById("loginError");

      // Password: 1234
      if (val === "1234") {
        err.style.display = "none";
        document.getElementById("loginBox").style.display = "none";
        
        // Show Animation
        const anim = document.getElementById("welcomeOverlay");
        anim.style.display = "flex";
        
        setTimeout(() => {
          anim.style.display = "none";
          document.getElementById("vaultView").style.display = "block";
          renderVaultPhotos();
        }, 1200);
      } else {
        err.innerText = "Galat Password! (Sahi password: 1234)";
        err.style.display = "block";
      }
    }

    function lockStudio() {
      document.getElementById("vaultView").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("passInput").value = "";
    }

    // Direct Upload to ImgBB Cloud
    async function uploadPhotoCloud() {
      const input = document.getElementById("photoChooser");
      const status = document.getElementById("uploadStatus");
      const file = input.files[0];
      if (!file) return;

      status.innerText = "Cloud server par upload ho raha hai...";
      const fd = new FormData();
      fd.append("image", file);

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
          method: "POST",
          body: fd
        });
        const data = await res.json();

        if (data.success) {
          status.innerText = "Photo cloud par safe save ho gayi!";
          myMedia.unshift({ id: Date.now(), url: data.data.url });
          localStorage.setItem("madhav_personal_vault", JSON.stringify(myMedia));
          renderVaultPhotos();
          setTimeout(() => { status.innerText = "Tap button to save photo"; }, 2500);
        } else {
          status.innerText = "Upload failed: " + data.error.message;
        }
      } catch (e) {
        status.innerText = "Network slow hai, dubara koshish karein.";
      }
    }

    // Render Grid
    function renderVaultPhotos() {
      const cont = document.getElementById("photoContainer");
      document.getElementById("statsText").innerText = myMedia.length + " Photos";
      cont.innerHTML = "";

      if (myMedia.length === 0) {
        cont.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b; padding:24px;">Abhi koi photo upload nahi hai.</p>`;
        return;
      }

      myMedia.forEach(item => {
        const div = document.createElement("div");
        div.className = "media-item";
        div.innerHTML = `
          <img src="${item.url}">
          <button class="delete-btn" onclick="deletePhotoItem(${item.id})">✕</button>
        `;
        cont.appendChild(div);
      });
    }

    function deletePhotoItem(id) {
      if (confirm("Kya aap ye photo hatana chahte hain?")) {
        myMedia = myMedia.filter(m => m.id !== id);
        localStorage.setItem("madhav_personal_vault", JSON.stringify(myMedia));
        renderVaultPhotos();
      }
    }
  </script>
</body>
</html>
