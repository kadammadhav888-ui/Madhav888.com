<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madhav Personal Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 440px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; text-align: center; margin-bottom: 8px; color: #38bdf8; }
    p.subtext { font-size: 13px; text-align: center; color: #94a3b8; margin-bottom: 20px; }
    input[type="password"], input[type="text"], input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .link-btn { background: none; border: none; color: #38bdf8; font-size: 13px; margin-top: 14px; cursor: pointer; text-decoration: underline; width: 100%; text-align: center; }
    .vault-container { display: none; width: 100%; max-width: 760px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
    .photo-item { position: relative; border-radius: 8px; overflow: hidden; background: #0f172a; border: 1px solid #334155; aspect-ratio: 1; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .msg-box { font-size: 13px; text-align: center; margin-top: 10px; display: none; color: #ef4444; }
  </style>
</head>
<body>

  <!-- 1. SET YOUR SECRET PASSWORD (FIRST SCREEN) -->
  <div class="card" id="setupBox">
    <h2>🔒 Set Secret Password</h2>
    <p class="subtext">Apna naya manpasand Secret Password banayein</p>
    <input type="password" id="newPass" placeholder="Enter New Secret Password">
    <input type="password" id="confirmPass" placeholder="Confirm Password">
    <button onclick="handleSavePassword()">Save Password & Enter</button>
    <p id="setupMsg" class="msg-box"></p>
  </div>

  <!-- 2. LOGIN SCREEN -->
  <div class="card" id="loginBox" style="display: none;">
    <h2>🔒 Madhav Photo Vault</h2>
    <p class="subtext">Enter your secret password to unlock</p>
    <input type="password" id="passInput" placeholder="Enter Secret Password">
    <button onclick="handleLogin()">Unlock Vault</button>
    <button class="link-btn" onclick="showForgotScreen()">Forgot Password?</button>
    <p id="loginError" class="msg-box"></p>
  </div>

  <!-- 3. FORGOT PASSWORD SCREEN -->
  <div class="card" id="forgotBox" style="display: none;">
    <h2>🔑 Reset Password</h2>
    <p class="subtext">Apna Master Recovery Code daal kar naya password banayein</p>
    <input type="text" id="recoveryCodeInput" placeholder="Enter Recovery Code">
    <input type="password" id="resetNewPass" placeholder="Enter New Password">
    <button onclick="handleResetPassword()">Reset & Open Vault</button>
    <button class="link-btn" onclick="showLoginScreen()">Back to Login</button>
    <p id="forgotMsg" class="msg-box"></p>
  </div>

  <!-- 4. VAULT DASHBOARD -->
  <div class="vault-container" id="vaultView">
    <div class="header-bar">
      <div>
        <h3 style="color: #38bdf8;">Madhav Cloud Vault</h3>
        <p style="font-size: 12px; color: #94a3b8;">Unlimited Cloud Storage</p>
      </div>
      <button onclick="handleLogout()" style="width: auto; padding: 8px 16px; background: #475569;">Lock Vault</button>
    </div>

    <div class="card" style="max-width: 100%;">
      <input type="file" id="fileInput" accept="image/*">
      <button onclick="uploadPhoto()">Upload Photo to Cloud</button>
      <p id="uploadStatus" style="font-size: 13px; text-align: center; margin-top: 10px; color: #38bdf8;"></p>
    </div>

    <div class="gallery-grid" id="photoGallery"></div>
  </div>

  <script>
    // ImgBB API Key
    const IMGBB_API_KEY = "0b61d186b1634f7eca045a72a950fa72";

    // Master Recovery Code (Password bhoolne par ye kaam aayega)
    const MASTER_RECOVERY_CODE = "MADHAV-VAULT-2026-RESET";

    // Check on startup
    window.onload = function() {
      // Purane 1234 ka koi bhi trace ho to use reset karne ke liye naya storage key use kiya hai:
      const savedPassword = localStorage.getItem("madhav_user_secret_password");

      if (!savedPassword) {
        document.getElementById("setupBox").style.display = "block";
        document.getElementById("loginBox").style.display = "none";
      } else {
        document.getElementById("setupBox").style.display = "none";
        document.getElementById("loginBox").style.display = "block";
      }
    };

    function handleSavePassword() {
      const p1 = document.getElementById("newPass").value.trim();
      const p2 = document.getElementById("confirmPass").value.trim();
      const msg = document.getElementById("setupMsg");

      if (!p1 || !p2) {
        msg.innerText = "Kripya password daalein!";
        msg.style.display = "block";
        return;
      }
      if (p1 !== p2) {
        msg.innerText = "Dono password match nahi ho rahe!";
        msg.style.display = "block";
        return;
      }

      localStorage.setItem("madhav_user_secret_password", p1);
      alert("Aapka naya Secret Password save ho gaya!");
      document.getElementById("setupBox").style.display = "none";
      openVault();
    }

    function handleLogin() {
      const enteredPass = document.getElementById("passInput").value.trim();
      const savedPass = localStorage.getItem("madhav_user_secret_password");
      const errorMsg = document.getElementById("loginError");

      if (enteredPass === savedPass) {
        errorMsg.style.display = "none";
        document.getElementById("loginBox").style.display = "none";
        openVault();
      } else {
        errorMsg.innerText = "Galat Password! Sahi password enter karein.";
        errorMsg.style.display = "block";
      }
    }

    function showForgotScreen() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("forgotBox").style.display = "block";
      document.getElementById("forgotMsg").style.display = "none";
      document.getElementById("recoveryCodeInput").value = "";
      document.getElementById("resetNewPass").value = "";
    }

    function showLoginScreen() {
      document.getElementById("forgotBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("passInput").value = "";
      document.getElementById("loginError").style.display = "none";
    }

    function handleResetPassword() {
      const code = document.getElementById("recoveryCodeInput").value.trim();
      const newPass = document.getElementById("resetNewPass").value.trim();
      const msg = document.getElementById("forgotMsg");

      if (code !== MASTER_RECOVERY_CODE) {
        msg.innerText = "Galat Recovery Code!";
        msg.style.display = "block";
        return;
      }
      if (!newPass) {
        msg.innerText = "Kripya naya password enter karein!";
        msg.style.display = "block";
        return;
      }

      localStorage.setItem("madhav_user_secret_password", newPass);
      alert("Password safaltapoorvak reset ho gaya!");
      document.getElementById("forgotBox").style.display = "none";
      openVault();
    }

    function openVault() {
      document.getElementById("vaultView").style.display = "block";
      loadPhotos();
    }

    function handleLogout() {
      document.getElementById("vaultView").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("passInput").value = "";
    }

    async function uploadPhoto() {
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("uploadStatus");
      const file = fileInput.files[0];

      if (!file) {
        alert("Pehle photo select karein!");
        return;
      }

      status.innerText = "Cloud me upload ho raha hai...";
      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          status.innerText = "Upload complete!";
          fileInput.value = "";
          savePhotoUrl(data.data.url);
          setTimeout(() => { status.innerText = ""; }, 2000);
        } else {
          status.innerText = "Error: " + data.error.message;
        }
      } catch (err) {
        status.innerText = "Upload fail: " + err.message;
      }
    }

    function savePhotoUrl(url) {
      let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");
      photos.unshift(url);
      localStorage.setItem("vault_photos", JSON.stringify(photos));
      loadPhotos();
    }

    function loadPhotos() {
      const gallery = document.getElementById("photoGallery");
      let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");

      gallery.innerHTML = "";
      if (photos.length === 0) {
        gallery.innerHTML = "<p style='color:#94a3b8; grid-column: 1/-1; text-align:center;'>Abhi tak koi photo nahi hai. Upload karein!</p>";
        return;
      }

      photos.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = "photo-item";
        div.innerHTML = `
          <img src="${url}">
          <button class="delete-btn" onclick="deletePhoto(${index})">Delete</button>
        `;
        gallery.appendChild(div);
      });
    }

    function deletePhoto(index) {
      if (confirm("Kya aap ise list se hatana chahte hain?")) {
        let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");
        photos.splice(index, 1);
        localStorage.setItem("vault_photos", JSON.stringify(photos));
        loadPhotos();
      }
    }
  </script>
</body>
</html>
