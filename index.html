<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madhav Personal Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #38bdf8; }
    input[type="password"], input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; margin-bottom: 16px; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
    button:hover { background: #0369a1; }
    .vault-container { display: none; width: 100%; max-width: 760px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
    .photo-item { position: relative; border-radius: 8px; overflow: hidden; background: #0f172a; border: 1px solid #334155; aspect-ratio: 1; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .status-text { font-size: 13px; text-align: center; margin-top: 10px; color: #38bdf8; }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div class="card" id="loginBox">
    <h2>🔒 Madhav Personal Vault</h2>
    <input type="password" id="pinInput" placeholder="Enter Secret PIN">
    <button onclick="handleLogin()">Unlock Vault</button>
    <p id="loginError" style="color:#ef4444; font-size:13px; text-align:center; margin-top:10px; display:none;">चुकीचा PIN! पुन्हा प्रयत्न करा.</p>
  </div>

  <!-- DASHBOARD -->
  <div class="vault-container" id="vaultView">
    <div class="header-bar">
      <div>
        <h3 style="color: #38bdf8;">Cloud Photo Vault</h3>
        <p style="font-size: 12px; color: #94a3b8;">Free Cloud Storage</p>
      </div>
      <button onclick="handleLogout()" style="width: auto; padding: 8px 16px; background: #475569;">Lock</button>
    </div>

    <div class="card" style="max-width: 100%;">
      <input type="file" id="fileInput" accept="image/*">
      <button onclick="uploadPhoto()">Upload Photo to Cloud</button>
      <p id="uploadStatus" class="status-text"></p>
    </div>

    <div class="gallery-grid" id="photoGallery"></div>
  </div>

  <script>
    // तुमची ImgBB API Key थेट जोडलेली आहे
    const IMGBB_API_KEY = "0b61d186b1634f7eca045a72a950fa72";

    // सीक्रेट PIN
    const SECRET_PIN = "1234";

    function handleLogin() {
      const enteredPin = document.getElementById("pinInput").value;
      const errorMsg = document.getElementById("loginError");
      if (enteredPin === SECRET_PIN) {
        errorMsg.style.display = "none";
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("vaultView").style.display = "block";
        loadPhotos();
      } else {
        errorMsg.style.display = "block";
      }
    }

    function handleLogout() {
      document.getElementById("pinInput").value = "";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("vaultView").style.display = "none";
    }

    async function uploadPhoto() {
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("uploadStatus");
      const file = fileInput.files[0];

      if (!file) {
        alert("कृपया आधी फोटो निवडा!");
        return;
      }

      status.innerText = "क्लाउडवर अपलोड होत आहे...";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          status.innerText = "अपलोड यशस्वी झाले!";
          fileInput.value = "";
          savePhotoUrl(data.data.url);
          setTimeout(() => { status.innerText = ""; }, 2000);
        } else {
          status.innerText = "Error: " + data.error.message;
        }
      } catch (err) {
        status.innerText = "अपलोड अयशस्वी: " + err.message;
      }
    }

    function savePhotoUrl(url) {
      let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");
      photos.unshift(url);
      localStorage.setItem("vault_photos", JSON.stringify(photos));
      loadPhotos();
    }

    function loadPhotos() {
      const gallery = document.getElementById("photoGallery");
      let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");

      gallery.innerHTML = "";
      if (photos.length === 0) {
        gallery.innerHTML = "<p style='color:#94a3b8; grid-column: 1/-1; text-align:center;'>अजून एकही फोटो नाही. नवीन फोटो अपलोड करा!</p>";
        return;
      }

      photos.forEach((url, index) => {
        const div = document.createElement("div");
        div.className = "photo-item";
        div.innerHTML = `
          <img src="${url}">
          <button class="delete-btn" onclick="deletePhoto(${index})">Delete</button>
        `;
        gallery.appendChild(div);
      });
    }

    function deletePhoto(index) {
      if (confirm("हा फोटो हटवायचा आहे का?")) {
        let photos = JSON.parse(localStorage.getItem("vault_photos") || "[]");
        photos.splice(index, 1);
        localStorage.setItem("vault_photos", JSON.stringify(photos));
        loadPhotos();
      }
    }
  </script>
</body>
</html>
